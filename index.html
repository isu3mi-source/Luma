<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#17120f">

  <title>Luma</title>

  <link rel="stylesheet" href="./style.css">
</head>

<body>

  <!-- 縦向き -->
  <div id="portraitWarning">
    <div class="rotateBox">
      <div class="rotateIcon">↻</div>
      <div class="rotateTitle">Luma</div>
      <div class="rotateText">端末を横向きにしてください</div>
    </div>
  </div>


  <!-- アプリ -->
  <div id="app">

    <div class="wallpaper"></div>


    <!-- HOME メニュー -->
    <button id="menuButton" class="roundGlass">
      <span></span>
      <span></span>
      <span></span>
    </button>


    <!-- 機能画面 閉じる -->
    <button id="closeButton" class="roundGlass closeButton">
      ×
    </button>


    <!-- Dynamic Island -->
    <div id="island">

      <div id="islandLeft"></div>

      <div id="islandCenter"></div>

      <div id="islandRight"></div>

    </div>


    <!-- HOME 天気 -->
    <button id="weatherMini" onclick="openPage('weather')">

      <span class="weatherIcon">☁️</span>

      <span class="weatherText">
        <strong id="miniTemp">--°</strong>
        <small id="miniCity">未設定</small>
      </span>

    </button>


    <!-- HOME -->
    <section id="homePage" class="page active">

      <div class="homeCenter">

        <div id="dateText"></div>

        <div id="clockText"></div>

        <div id="homeReminderList">

          <div class="homeReminder">
            <button class="circleCheck"></button>
            <span>宿題をする</span>
            <time>23:30</time>
          </div>

          <div class="homeReminder">
            <button class="circleCheck"></button>
            <span>明日の準備</span>
          </div>

        </div>

      </div>

    </section>


    <!-- アラーム -->
    <section id="alarmPage" class="page">

      <div class="glassPanel">

        <h1>アラーム</h1>

        <div class="centerContent">

          <div class="featureIcon">◉</div>

          <h2>アラーム</h2>

          <p>アラーム機能は現在準備中です。</p>

        </div>

      </div>

    </section>


    <!-- タイマー -->
    <section id="timerPage" class="page">

      <div class="glassPanel">

        <h1>タイマー</h1>

        <div id="timerDisplay" class="largeTime">
          05:00
        </div>

        <div class="buttonRow">

          <button onclick="setTimer(300)">5分</button>

          <button onclick="setTimer(600)">10分</button>

          <button onclick="setTimer(1800)">30分</button>

        </div>

        <div class="buttonRow">

          <button onclick="startTimer()">スタート</button>

          <button onclick="pauseTimer()">一時停止</button>

          <button onclick="resetTimer()">リセット</button>

        </div>

      </div>

    </section>


    <!-- ストップウォッチ -->
    <section id="stopwatchPage" class="page">

      <div class="glassPanel">

        <h1>ストップウォッチ</h1>

        <div id="stopwatchDisplay" class="largeTime">
          00:00.0
        </div>

        <div class="buttonRow">

          <button onclick="startStopwatch()">スタート</button>

          <button onclick="pauseStopwatch()">一時停止</button>

          <button onclick="resetStopwatch()">リセット</button>

        </div>

      </div>

    </section>


    <!-- 世界時計 -->
    <section id="worldPage" class="page">

      <div class="glassPanel">

        <h1>世界時計</h1>

        <div class="worldList">

          <div class="worldItem">
            <span>東京</span>
            <strong id="tokyoTime">--:--</strong>
          </div>

          <div class="worldItem">
            <span>ロンドン</span>
            <strong id="londonTime">--:--</strong>
          </div>

          <div class="worldItem">
            <span>ニューヨーク</span>
            <strong id="newYorkTime">--:--</strong>
          </div>

        </div>

      </div>

    </section>


    <!-- リマインダー -->
    <section id="reminderPage" class="page">

      <div class="glassPanel">

        <h1>リマインダー</h1>

        <button id="addReminderButton" onclick="addReminder()">
          ＋
        </button>

        <div id="reminderList"></div>

      </div>

    </section>


    <!-- 天気 -->
    <section id="weatherPage" class="page">

      <div class="weatherPanel">

        <button id="addCityButton" onclick="changeCity()">
          ＋
        </button>

        <div class="weatherCenter">

          <h2 id="weatherCity">
            市町村を追加
          </h2>

          <div id="weatherTemp">
            --°
          </div>

          <div id="weatherCondition">
            天気情報
          </div>

          <p class="smallNote">
            ＋を押して市町村を設定
          </p>

        </div>

      </div>

    </section>


    <!-- ミュージック -->
    <section id="musicPage" class="page">

      <div class="glassPanel">

        <h1>ミュージック</h1>

        <div class="musicCenter">

          <div class="musicIcon">♪</div>

          <h2 id="musicTitle">曲を追加</h2>

          <input
            id="musicFile"
            type="file"
            accept="audio/*"
            hidden
          >

          <button onclick="selectMusic()">
            ＋ 曲を追加
          </button>

          <audio
            id="audioPlayer"
            controls>
          </audio>

        </div>

      </div>

    </section>


    <!-- 設定 -->
    <section id="settingsPage" class="page">

      <div class="glassPanel">

        <h1>設定</h1>

        <div class="settingsList">

          <label class="settingItem">

            <span>秒を表示</span>

            <input id="secondsToggle" type="checkbox">

          </label>

          <label class="settingItem">

            <span>ホームのリマインダー</span>

            <input
              id="homeReminderToggle"
              type="checkbox"
              checked
            >

          </label>

          <div class="settingItem">
            <span>バージョン</span>
            <strong>Luma β 0.2</strong>
          </div>

        </div>

      </div>

    </section>


    <!-- メニュー背景 -->
    <div id="menuOverlay"></div>


    <!-- メニュー -->
    <aside id="sideMenu">

      <h2>Luma</h2>

      <button onclick="openPage('home')">
        ◷　時計
      </button>

      <button onclick="openPage('alarm')">
        ◉　アラーム
      </button>

      <button onclick="openPage('timer')">
        ◴　タイマー
      </button>

      <button onclick="openPage('stopwatch')">
        ◷　ストップウォッチ
      </button>

      <button onclick="openPage('world')">
        ◎　世界時計
      </button>

      <button onclick="openPage('reminder')">
        ☷　リマインダー
      </button>

      <button onclick="openPage('weather')">
        ☁　天気
      </button>

      <button onclick="openPage('music')">
        ♪　ミュージック
      </button>

      <div class="divider"></div>

      <button onclick="openPage('settings')">
        ⚙　設定
      </button>

    </aside>

  </div>


  <script src="./script.js"></script>

</body>
</html>
